name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore
      - run: dotnet test --no-build

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/frontend/drovik-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/frontend/drovik-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose --profile app config --quiet
      - run: docker compose --profile app build

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/frontend/drovik-web/package-lock.json
      - run: ./start.sh
      - run: npm ci
        working-directory: src/frontend/drovik-web
      - run: npx playwright install --with-deps chromium
        working-directory: src/frontend/drovik-web
      - name: Run browser tests
        working-directory: src/frontend/drovik-web
        run: |
          export E2E_EMAIL="$(grep '^DROVIK_ADMIN_EMAIL=' ../../../.env | cut -d= -f2-)"
          export E2E_PASSWORD="$(grep '^DROVIK_ADMIN_PASSWORD=' ../../../.env | cut -d= -f2-)"
          npm run e2e
      - name: Show service logs
        if: failure()
        run: docker compose --profile app logs --no-color --tail 200
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: src/frontend/drovik-web/playwright-report
          retention-days: 7
