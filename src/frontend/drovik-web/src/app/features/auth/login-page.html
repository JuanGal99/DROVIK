<main class="login-page">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="login-brand"><app-brand-mark /><strong>DROVIK</strong></div>
    <h1 id="login-title">Iniciar sesión</h1>
    <p class="login-intro">Consola de operaciones de Northline Logistics.</p>
    <form (ngSubmit)="submit()" #loginForm="ngForm">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" required autocomplete="username" [ngModel]="email()" (ngModelChange)="email.set($event)">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" [ngModel]="password()" (ngModelChange)="password.set($event)">
      @if (auth.notice()) { <p class="form-notice" role="status">{{ auth.notice() }}</p> }
      @if (formError()) { <p class="form-error" role="alert">{{ formError() }}</p> }
      <button class="login-button" type="submit" [disabled]="loginForm.invalid || auth.busy()">@if (auth.busy()) { Verificando… } @else { Iniciar sesión }</button>
      <p class="login-help">¿Olvidaste tu contraseña? Un administrador puede restablecerla.</p>
    </form>
  </section>
  <aside class="login-globe"><img src="login-globe.svg" alt=""></aside>
</main>
