<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
<defs>
 <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf2f8"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#1746a2"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#152b45" flood-opacity=".12"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#71849a" stroke-width="1.4"/></marker>
 <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#2563eb" stroke-width="1.4"/></marker>
</defs>
<rect width="1500" height="1040" rx="24" fill="url(#canvas)"/>
<text x="750" y="58" text-anchor="middle" font-family="Inter,Arial" font-size="30" font-weight="800" fill="#102338">DROVIK · SYSTEM ARCHITECTURE</text>
<text x="750" y="88" text-anchor="middle" font-family="Inter,Arial" font-size="15" fill="#64788d">Logical view · Microservices · Single fictional logistics company</text>

<!-- frontend and gateway -->
<g filter="url(#shadow)" font-family="Inter,Arial">
 <rect x="520" y="125" width="460" height="76" rx="14" fill="#132b43"/>
 <text x="750" y="157" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Angular Web Application</text>
 <text x="750" y="181" text-anchor="middle" fill="#c5d5e5" font-size="13">TypeScript · PrimeNG · Leaflet map</text>
 <rect x="555" y="245" width="390" height="72" rx="14" fill="url(#blue)"/>
 <text x="750" y="276" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">YARP API Gateway</text>
 <text x="750" y="298" text-anchor="middle" fill="#dbeafe" font-size="13">Single HTTP entry point · Routing</text>
</g>
<path d="M750 201V242" stroke="#71849a" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- service boxes -->
<g font-family="Inter,Arial" filter="url(#shadow)">
 <g><rect x="70" y="390" width="245" height="118" rx="14" fill="#fff" stroke="#cbd7e4"/><rect x="70" y="390" width="245" height="9" rx="5" fill="#64748b"/><text x="192" y="435" text-anchor="middle" font-size="18" font-weight="700" fill="#183047">Identity Service</text><text x="192" y="461" text-anchor="middle" font-size="13" fill="#64788d">Users · Roles · Auth</text></g>
 <g><rect x="345" y="390" width="245" height="118" rx="14" fill="#fff" stroke="#cbd7e4"/><rect x="345" y="390" width="245" height="9" rx="5" fill="#0d9488"/><text x="467" y="435" text-anchor="middle" font-size="18" font-weight="700" fill="#183047">Fleet Service</text><text x="467" y="461" text-anchor="middle" font-size="13" fill="#64788d">Vehicles · Drivers · Depots</text></g>
 <g><rect x="620" y="390" width="245" height="118" rx="14" fill="#fff" stroke="#cbd7e4"/><rect x="620" y="390" width="245" height="9" rx="5" fill="#2563eb"/><text x="742" y="435" text-anchor="middle" font-size="18" font-weight="700" fill="#183047">Shipment Service</text><text x="742" y="461" text-anchor="middle" font-size="13" fill="#64788d">Customers · Shipments · Status</text></g>
 <g><rect x="895" y="390" width="245" height="118" rx="14" fill="#fff" stroke="#cbd7e4"/><rect x="895" y="390" width="245" height="9" rx="5" fill="#7c3aed"/><text x="1017" y="435" text-anchor="middle" font-size="18" font-weight="700" fill="#183047">Simulation Service</text><text x="1017" y="461" text-anchor="middle" font-size="13" fill="#64788d">Simulation clock · Positions</text></g>
 <g><rect x="1170" y="390" width="245" height="118" rx="14" fill="#fff" stroke="#cbd7e4"/><rect x="1170" y="390" width="245" height="9" rx="5" fill="#ea580c"/><text x="1292" y="435" text-anchor="middle" font-size="18" font-weight="700" fill="#183047">Incident Service</text><text x="1292" y="461" text-anchor="middle" font-size="13" fill="#64788d">Incident lifecycle</text></g>
</g>
<!-- gateway fanout -->
<g stroke="#71849a" stroke-width="2" fill="none">
 <path d="M750 317V350H192V387M750 350H467V387M750 350V387M750 350H1017V387M750 350H1292V387"/>
</g>
<g font-family="Inter,Arial" font-size="12" fill="#71849a">
 <text x="750" y="340" text-anchor="middle">HTTP / REST</text>
</g>

<!-- databases -->
<g font-family="Inter,Arial" filter="url(#shadow)">
 <g fill="#e8f0f8" stroke="#9db2c8" stroke-width="1.5">
  <rect x="100" y="570" width="185" height="66" rx="12"/><rect x="375" y="570" width="185" height="66" rx="12"/><rect x="650" y="570" width="185" height="66" rx="12"/><rect x="925" y="570" width="185" height="66" rx="12"/><rect x="1200" y="570" width="185" height="66" rx="12"/>
 </g>
 <g fill="#183047" font-size="15" font-weight="700" text-anchor="middle">
  <text x="192" y="598">Identity DB</text><text x="467" y="598">Fleet DB</text><text x="742" y="598">Shipment DB</text><text x="1017" y="598">Simulation DB</text><text x="1292" y="598">Incident DB</text>
 </g>
 <g fill="#64788d" font-size="12" text-anchor="middle">
  <text x="192" y="619">SQL Server</text><text x="467" y="619">SQL Server</text><text x="742" y="619">SQL Server</text><text x="1017" y="619">SQL Server</text><text x="1292" y="619">SQL Server</text>
 </g>
</g>
<g stroke="#9db2c8" stroke-width="2" fill="none">
 <path d="M192 508V567M467 508V567M742 508V567M1017 508V567M1292 508V567"/>
</g>

<!-- messaging and realtime -->
<g filter="url(#shadow)" font-family="Inter,Arial">
 <rect x="390" y="735" width="720" height="92" rx="16" fill="#fff" stroke="#d3a84b" stroke-width="2"/>
 <text x="750" y="773" text-anchor="middle" font-size="21" font-weight="800" fill="#183047">RabbitMQ · Event Bus</text>
 <text x="750" y="799" text-anchor="middle" font-size="14" fill="#64788d">Asynchronous domain events · Retries · Dead-letter queues</text>
 <rect x="1150" y="735" width="265" height="92" rx="16" fill="#eaf2ff" stroke="#8db5f4" stroke-width="1.5"/>
 <text x="1282" y="773" text-anchor="middle" font-size="19" font-weight="700" fill="#1746a2">SignalR</text>
 <text x="1282" y="799" text-anchor="middle" font-size="13" fill="#476b9a">Live browser updates</text>
 <rect x="85" y="735" width="245" height="92" rx="16" fill="#e8f7f5" stroke="#79c9bd" stroke-width="1.5"/>
 <text x="207" y="773" text-anchor="middle" font-size="19" font-weight="700" fill="#12665e">Redis (optional)</text>
 <text x="207" y="799" text-anchor="middle" font-size="13" fill="#397e77">Cache / ephemeral state</text>
</g>
<g stroke="#d0a64a" stroke-width="2" fill="none" stroke-dasharray="7 6">
 <path d="M467 636V685H500V732M742 636V732M1017 636V685H1000V732M1292 636V685H1090V732"/>
</g>
<g stroke="#2563eb" stroke-width="2" fill="none">
 <path d="M1110 780H1147"/>
 <path d="M1282 735V680H750V320" stroke-dasharray="5 6" opacity=".0"/>
</g>
<path d="M1282 735V690H750V320" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity=".55"/>
<path d="M1017 508V680H207V732" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity=".6"/>

<g font-family="Inter,Arial">
 <text x="750" y="895" text-anchor="middle" font-size="15" font-weight="700" fill="#183047">Supporting infrastructure</text>
 <rect x="300" y="920" width="900" height="62" rx="13" fill="#132b43"/>
 <text x="750" y="946" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Docker Compose · OpenTelemetry + Serilog · GitHub Actions</text>
 <text x="750" y="968" text-anchor="middle" fill="#c5d5e5" font-size="12">OSRM / OpenStreetMap for route visualization · Synthetic demo data only</text>
</g>
</svg>